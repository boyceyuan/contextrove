[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-memory-gateway"
version = "0.1.0"
description = "A small file-first memory gateway for agents, with revision-checked Markdown updates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]

[project.scripts]
shared-memory = "shared_memory_gateway.cli:main"
shared-memory-mcp = "shared_memory_gateway.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shared_memory_gateway = ["skills/shared-context/SKILL.md"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
