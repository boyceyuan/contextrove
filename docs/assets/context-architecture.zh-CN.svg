<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">共享上下文架构</title>
  <desc id="desc">Codex 与 OpenCode 加载共享上下文 Skill，由 Skill 指导 CLI 调用重复使用的本地核心；MCP 是可选适配器。所有入口共享个人与项目 Markdown、本机配置和锁目录；下方展示读取、预览差异与复核版本后应用的流程。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172b30; }
      .k { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #53666b; }
      .h { font-size: 31px; font-weight: 700; }
      .sub { font-size: 16px; fill: #506268; }
      .label { font-size: 21px; font-weight: 650; }
      .small { font-size: 15px; fill: #53666b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; fill: #174954; }
      .num { font-size: 25px; font-weight: 750; fill: #96e3d5; }
      .inverse { fill: #ffffff; }
      .inverse-k { fill: #a9cbc8; }
      .line { fill: none; stroke: #55777b; stroke-width: 2; marker-end: url(#arrow); }
      .light { fill: none; stroke: #8ba4a4; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#55777b"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dbe5e4" stroke-width="1"/></pattern>
  </defs>

  <rect width="1440" height="810" fill="#f6f9f8"/>
  <rect width="1440" height="810" fill="url(#grid)" opacity=".35"/>
  <rect width="1440" height="8" fill="#08756e"/>
  <text x="64" y="58" class="k">整体方案 / 本地优先</text>
  <text x="64" y="105" class="h">一份规范知识，共享 Agent 工作流</text>
  <text x="64" y="136" class="sub">Skill 指导 CLI 操作；MCP 保留为可选适配器。</text>

  <text x="64" y="188" class="k">01   Agent 客户端</text>
  <text x="455" y="188" class="k">02   Skill 与本地访问层</text>
  <text x="885" y="188" class="k">03   规范上下文</text>

  <rect x="64" y="210" width="308" height="122" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <rect x="64" y="210" width="7" height="122" fill="#127870"/>
  <text x="88" y="249" class="label">OpenCode</text>
  <text x="88" y="278" class="small">共享上下文 Skill</text>
  <text x="88" y="306" class="mono">CLI（主路径）</text>

  <rect x="64" y="347" width="308" height="122" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <rect x="64" y="347" width="7" height="122" fill="#d18a45"/>
  <text x="88" y="386" class="label">Codex</text>
  <text x="88" y="415" class="small">共享上下文 Skill</text>
  <text x="88" y="443" class="mono">CLI（主路径）</text>

  <rect x="64" y="484" width="308" height="86" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <text x="88" y="522" class="label">JSON CLI</text>
  <text x="88" y="548" class="small">复用同一核心实现</text>

  <rect x="455" y="210" width="344" height="360" rx="6" fill="#e7f1ef" stroke="#8cbab4" stroke-width="2"/>
  <text x="480" y="249" class="label">CLI / 共享核心</text>
  <text x="480" y="277" class="small">可选 MCP 适配器复用同一核心</text>
  <path d="M477 294H777" stroke="#a9c7c3" stroke-width="2"/>
  <rect x="480" y="311" width="293" height="61" rx="4" fill="#ffffff"/>
  <text x="496" y="340" class="mono">bootstrap · search · read</text>
  <text x="496" y="358" class="small">Skill 指导每次从文件读取当前内容</text>
  <rect x="480" y="381" width="293" height="75" rx="4" fill="#ffffff"/>
  <text x="496" y="409" class="mono">propose → apply</text>
  <text x="496" y="430" class="small">预览差异、校验版本、替换文件</text>
  <path d="M477 473H777" stroke="#a9c7c3" stroke-width="2"/>
  <text x="480" y="505" class="small">文件白名单 · 显式项目根路径</text>
  <text x="480" y="534" class="small">协作进程的逐文件锁</text>

  <path class="line" d="M372 271H455"/>
  <path class="line" d="M372 408H455"/>
  <path class="line" d="M372 527H455"/>

  <rect x="885" y="210" width="490" height="215" rx="6" fill="#ffffff" stroke="#87aaa5" stroke-width="2"/>
  <rect x="885" y="210" width="490" height="43" rx="6" fill="#0d5755"/>
  <path d="M885 246H1375" stroke="#0d5755" stroke-width="14"/>
  <text x="904" y="238" font-size="18" font-weight="700" class="inverse">规范 Markdown</text>
  <text x="908" y="291" class="mono">personal-context.md</text>
  <text x="908" y="321" class="small">稳定偏好与协作约定</text>
  <path d="M908 340H1352" stroke="#dce6e4"/>
  <text x="908" y="375" class="mono">projects/current-project.md</text>
  <text x="908" y="403" class="small">项目专题、决策与证据</text>
  <path class="line" d="M799 315H885"/>

  <rect x="885" y="443" width="231" height="127" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <text x="906" y="479" class="label">本机配置</text>
  <text x="906" y="508" class="mono">memory.local.json</text>
  <text x="906" y="539" class="small">白名单与项目路径</text>
  <rect x="1130" y="443" width="245" height="127" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <text x="1151" y="479" class="label">共享状态目录</text>
  <text x="1151" y="508" class="mono">.state/</text>
  <text x="1151" y="539" class="small">仅存空锁文件</text>
  <path class="light" d="M885 501H799"/>
  <path class="light" d="M1130 559V584H814V534H799"/>
  <text x="885" y="617" class="small">人工编辑器直接修改 Markdown，不参与 Gateway 锁。</text>

  <rect x="64" y="665" width="1311" height="112" rx="6" fill="#17383b"/>
  <text x="90" y="697" font-size="15" font-weight="700" class="inverse-k">修订路径</text>
  <text x="92" y="740" class="num">01</text><text x="139" y="740" font-size="17" class="inverse">读取当前文件与版本</text>
  <path d="M439 733H471" stroke="#9bc2bd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="493" y="740" class="num">02</text><text x="540" y="740" font-size="17" class="inverse">提出修订，审阅差异</text>
  <path d="M806 733H838" stroke="#9bc2bd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="863" y="740" class="num">03</text><text x="910" y="740" font-size="17" class="inverse">重新校验版本并应用</text>
</svg>
