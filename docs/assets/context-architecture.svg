<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">ContextRove: shared context architecture</title>
  <desc id="desc">Local coding agents use client-specific Skill install paths to reach the same ContextRove CLI and file core. Discovery and model execution are validated separately. MCP remains optional. All access uses canonical personal and project Markdown, one config and one lock directory. A human editor accesses Markdown directly. The lower panel shows read, propose and revision-checked apply.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b30; }
      .k { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #53666b; }
      .h { font-size: 31px; font-weight: 700; }
      .sub { font-size: 16px; fill: #506268; }
      .label { font-size: 21px; font-weight: 650; }
      .small { font-size: 15px; fill: #53666b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; fill: #174954; }
      .num { font-size: 25px; font-weight: 750; fill: #96e3d5; }
      .inverse { fill: #ffffff; }
      .inverse-k { fill: #a9cbc8; }
      .line { fill: none; stroke: #55777b; stroke-width: 2; marker-end: url(#arrow); }
      .light { fill: none; stroke: #8ba4a4; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#55777b"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dbe5e4" stroke-width="1"/></pattern>
  </defs>

  <rect width="1440" height="810" fill="#f6f9f8"/>
  <rect width="1440" height="810" fill="url(#grid)" opacity=".35"/>
  <rect width="1440" height="8" fill="#08756e"/>
  <text x="64" y="58" class="k">CONTEXTROVE / LOCAL-FIRST</text>
  <text x="64" y="105" class="h">One source of truth. A shared agent workflow.</text>
  <text x="64" y="136" class="sub">The Skill guides CLI actions; MCP remains an optional adapter.</text>

  <text x="64" y="188" class="k">01   AGENT CLIENTS</text>
  <text x="455" y="188" class="k">02   SKILL + LOCAL ACCESS</text>
  <text x="885" y="188" class="k">03   CANONICAL CONTEXT</text>

  <rect x="64" y="210" width="308" height="122" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <rect x="64" y="210" width="7" height="122" fill="#127870"/>
  <text x="88" y="249" class="label">Local coding agents</text>
  <text x="88" y="278" class="small">Skill + client-specific install path</text>
  <text x="88" y="306" class="mono">CLI (primary)</text>

  <rect x="64" y="347" width="308" height="122" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <rect x="64" y="347" width="7" height="122" fill="#d18a45"/>
  <text x="88" y="386" class="label">Client validation</text>
  <text x="88" y="415" class="small">Discovery ≠ model execution</text>
  <text x="88" y="443" class="mono">CLI (primary)</text>

  <rect x="64" y="484" width="308" height="86" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <text x="88" y="522" class="label">JSON CLI</text>
  <text x="88" y="548" class="small">Same core implementation</text>

  <rect x="455" y="210" width="344" height="360" rx="6" fill="#e7f1ef" stroke="#8cbab4" stroke-width="2"/>
  <text x="480" y="249" class="label">CLI / shared core</text>
  <text x="480" y="277" class="small">Optional MCP adapter uses this same core</text>
  <path d="M477 294H777" stroke="#a9c7c3" stroke-width="2"/>
  <rect x="480" y="311" width="293" height="61" rx="4" fill="#ffffff"/>
  <text x="496" y="340" class="mono">bootstrap · search · read</text>
  <text x="496" y="358" class="small">Skill-guided live reads from disk</text>
  <rect x="480" y="381" width="293" height="75" rx="4" fill="#ffffff"/>
  <text x="496" y="409" class="mono">propose → apply</text>
  <text x="496" y="430" class="small">Diff, revision check, file replace</text>
  <path d="M477 473H777" stroke="#a9c7c3" stroke-width="2"/>
  <text x="480" y="505" class="small">Allowlist · explicit project roots</text>
  <text x="480" y="534" class="small">Cooperative per-file locks</text>

  <path class="line" d="M372 271H455"/>
  <path class="line" d="M372 408H455"/>
  <path class="line" d="M372 527H455"/>

  <rect x="885" y="210" width="490" height="215" rx="6" fill="#ffffff" stroke="#87aaa5" stroke-width="2"/>
  <rect x="885" y="210" width="490" height="43" rx="6" fill="#0d5755"/>
  <path d="M885 246H1375" stroke="#0d5755" stroke-width="14"/>
  <text x="904" y="238" font-size="18" font-weight="700" class="inverse">CANONICAL MARKDOWN</text>
  <text x="908" y="291" class="mono">personal-context.md</text>
  <text x="908" y="321" class="small">Stable preferences and collaboration rules</text>
  <path d="M908 340H1352" stroke="#dce6e4"/>
  <text x="908" y="375" class="mono">projects/current-project.md</text>
  <text x="908" y="403" class="small">Project topics, decisions and evidence</text>
  <path class="line" d="M799 315H885"/>

  <rect x="885" y="443" width="231" height="127" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <text x="906" y="479" class="label">Local config</text>
  <text x="906" y="508" class="mono">memory.local.json</text>
  <text x="906" y="539" class="small">Allowlist + project paths</text>
  <rect x="1130" y="443" width="245" height="127" rx="6" fill="#ffffff" stroke="#c5d5d4" stroke-width="2"/>
  <text x="1151" y="479" class="label">Shared state</text>
  <text x="1151" y="508" class="mono">.state/</text>
  <text x="1151" y="539" class="small">Empty lock files only</text>
  <path class="light" d="M885 501H799"/>
  <path class="light" d="M1130 559V584H814V534H799"/>
  <text x="885" y="617" class="small">Human editors edit Markdown directly, outside gateway locks.</text>

  <rect x="64" y="665" width="1311" height="112" rx="6" fill="#17383b"/>
  <text x="90" y="697" font-size="13" font-weight="700" letter-spacing="2" class="inverse-k">CORRECTION PATH</text>
  <text x="92" y="740" class="num">01</text><text x="139" y="740" font-size="17" class="inverse">Read current file + revision</text>
  <path d="M439 733H471" stroke="#9bc2bd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="493" y="740" class="num">02</text><text x="540" y="740" font-size="17" class="inverse">Propose and inspect diff</text>
  <path d="M806 733H838" stroke="#9bc2bd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="863" y="740" class="num">03</text><text x="910" y="740" font-size="17" class="inverse">Recheck revision, then apply</text>
</svg>
